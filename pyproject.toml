[project]
name = "ferry-forecaster"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.163.1",
    "holidays>=0.108",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytz>=2026.6",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "paramiko>=5.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
